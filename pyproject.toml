[project]
name = "repo-recon"
version = "0.1.0"
description = "Read an unfamiliar Python codebase from its AST: structure, impact, modernisation risk, release readiness. An MCP server with no dependencies that writes nothing and runs nothing."
authors = [{ name = "Muhammad Hammas" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "mcp", "mcp-server", "ast", "static-analysis", "code-review",
    "codebase", "call-graph", "modernisation", "developer-tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hammasbuilds/repo-recon"
Issues = "https://github.com/hammasbuilds/repo-recon/issues"
Source = "https://github.com/hammasbuilds/repo-recon"

[project.scripts]
repo-recon-mcp = "reporecon.mcp_server:main"
# Same server under the package name, so `uvx repo-recon` (what MCP registry clients
# run for a PyPI package) starts it without --from.
repo-recon = "reporecon.mcp_server:main"
# The four tools keep their own command lines; the MCP server is an addition, not a
# replacement.
repo-cartographer = "reporecon.cartographer.cli:main"
migration-pilot = "reporecon.pilot.cli:main"
release-captain = "reporecon.captain.cli:main"
review-bot = "reporecon.reviewbot.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reporecon"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
# so `pytest` works in a fresh clone, with nothing installed
pythonpath = ["src"]
testpaths = ["tests"]
# An unregistered mark is a no-op with a warning: `-m "not slow"` quietly deselects
# nothing and the suite looks like it has a fast path it does not have.
markers = ["slow: runs the review over this whole checkout rather than a fixture"]
