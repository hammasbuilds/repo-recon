name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-readiness and risk tools read git history; a shallow clone
          # gives them one commit and makes their tests meaningless.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # ruff is pinned, not floated. `ruff format` output changes between minor
      # versions, so an unpinned install turns CI red with a formatting diff in files
      # nobody touched - which is what happened here. Same specifier as agentic-ai-llm.
      # `tomli` only for Python 3.10, where `tomllib` is not in the standard
      # library yet. Without it tests/test_manifest.py fails at collection on the
      # oldest version `requires-python` promises, and every claim it makes about
      # server.json goes unchecked there.
      - run: pip install pytest "ruff>=0.16,<0.17" jsonschema 'tomli; python_version < "3.11"'
      # The whole tree, not `src tests`. `demo.py`, `docs/` and the workflow files
      # were outside the gate, so a formatting violation in the document that shows
      # this tool's own sample input sat in `main` through a green CI. The one block
      # that must stay unformatted - it IS the before-modernisation sample - is
      # excluded in pyproject, where the exclusion travels with the repository.
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install -e .
      - run: pytest -q
      # the installed entry points, as an MCP client would start them
      - run: repo-recon-mcp --check
      - run: repo-recon --check
      # and the four command lines the tools kept
      - run: repo-cartographer --help
      - run: migration-pilot --help
      - run: release-captain --help
      - run: review-bot --help
      # the server maps its own repository: a smoke test with a real answer
      - run: repo-cartographer map . --json | head -40
